spring.application.name=skill-exchange

# Override with environment variables; never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skill_exchange_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT signing key (32+ characters). If empty, a random key is generated at startup,
# which means everyone is logged out whenever the app restarts.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-hours=24
