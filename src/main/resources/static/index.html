<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillSwap – trade what you know for what you want to learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <h1 class="brand">Skill<span>Swap</span></h1>
      <div class="who">
        <label for="me">Using the app as</label>
        <select id="me"></select>
        <button class="btn ghost" id="newBtn">New student</button>
      </div>
    </div>
    <nav class="wrap tabs" id="tabs" aria-label="Sections">
      <button data-tab="matches" aria-current="page">Matches</button>
      <button data-tab="browse">Browse</button>
      <button data-tab="requests">Requests <b id="badge" hidden></b></button>
      <button data-tab="profile">My profile</button>
    </nav>
  </header>

  <main class="wrap" id="view" aria-live="polite"></main>

  <dialog id="regDialog">
    <form method="dialog" id="regForm">
      <h2>Create a student profile</h2>
      <label>Name <input name="name" required maxlength="80" autocomplete="name"></label>
      <label>Email <input name="email" type="email" required autocomplete="email"></label>
      <label>Short bio <textarea name="bio" rows="3" maxlength="300" placeholder="Course, year, what you're after"></textarea></label>
      <div class="row end">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button class="btn" type="submit">Create profile</button>
      </div>
    </form>
  </dialog>

  <dialog id="swapDialog">
    <form method="dialog" id="swapForm">
      <h2 id="swapTitle">Request a swap</h2>
      <label>You teach <select name="offered" required></select></label>
      <label>You learn <select name="requested" required></select></label>
      <div class="row end">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button class="btn" type="submit">Send request</button>
      </div>
    </form>
  </dialog>

  <div id="toast" popover="manual" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
